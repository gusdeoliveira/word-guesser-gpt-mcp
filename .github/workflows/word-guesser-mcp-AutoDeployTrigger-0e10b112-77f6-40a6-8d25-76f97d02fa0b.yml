name: Trigger auto deployment for word-guesser-mcp

# When this action will be executed
on:
  # Automatically trigger it when detected changes in repo
  push:
    branches: 
      [ main ]
    paths:
    - '**'
    - '.github/workflows/word-guesser-mcp-AutoDeployTrigger-0e10b112-77f6-40a6-8d25-76f97d02fa0b.yml'

  # Allow manual trigger 
  workflow_dispatch:      

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions: 
      id-token: write #This is required for requesting the OIDC JWT Token
      contents: read #Required when GH token is used to authenticate with private repo

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v2

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.WORDGUESSERMCP_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.WORDGUESSERMCP_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.WORDGUESSERMCP_AZURE_SUBSCRIPTION_ID }}

      - name: Build and push container image to registry
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}
          _dockerfilePathKey_: _dockerfilePath_
          _targetLabelKey_: _targetLabel_
          registryUrl: 
          registryUsername: ${{ secrets.WORDGUESSERMCP_REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.WORDGUESSERMCP_REGISTRY_PASSWORD }}
          containerAppName: word-guesser-mcp
          resourceGroup: Database
          imageToBuild: default/[parameters('containerAppName')]:${{ github.sha }}
          _buildArgumentsKey_: |
            _buildArgumentsValues_


